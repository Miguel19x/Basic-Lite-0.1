name: Basic-Lite TRACE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y gcc libomp-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build C Kernel
        run: make

      - name: Run Smoke Tests
        run: PYTHONPATH=. pytest tests/test_smoke.py -v
